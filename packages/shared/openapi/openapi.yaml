openapi: 3.1.0
info:
  title: Smart Checkup Portal API
  version: 0.1.0
  description: Local training API. It accepts synthetic or de-identified data only.
servers:
  - url: https://localhost/api/v1
paths:
  /health:
    get:
      summary: Process liveness
      responses:
        '200':
          description: Process is alive
  /health/ready:
    get:
      summary: Service readiness
      responses:
        '200':
          description: SQLite dependency is ready
        '503':
          description: Service is not ready or draining
  /auth/csrf-token:
    get:
      summary: Create or return a server-side synchronizer token
      responses:
        '200':
          description: CSRF token for state-changing requests
  /auth/login:
    post:
      summary: Start a server-side session
      description: >-
        Regenerates the session ID and returns a new CSRF token. Every failure (unknown account,
        wrong password, locked or disabled account) returns the same 401 response.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session and CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/CsrfError'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /auth/logout:
    post:
      summary: Revoke the current session
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/CsrfError'
  /auth/me:
    get:
      summary: Return the authenticated user
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current user without credential or session internals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /auth/password:
    post:
      summary: Change the current user's password
      description: >-
        Applies the server-side password policy, clears the forced-change flag and revokes the
        user's other sessions.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/CsrfError'
  /audit-events:
    get:
      summary: List audit events (requires AUDIT_READ)
      description: Read-only, newest first. Metadata is redacted and never contains e-mail addresses.
      security:
        - sessionCookie: []
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: eventType, in: query, schema: { $ref: '#/components/schemas/AuditEventType' } }
        - { name: outcome, in: query, schema: { $ref: '#/components/schemas/AuditOutcome' } }
        - { name: actorId, in: query, schema: { type: string, maxLength: 128 } }
        - {
            name: resourceType,
            in: query,
            schema: { $ref: '#/components/schemas/AuditResourceType' },
          }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        '200':
          description: Page of audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          description: Missing AUDIT_READ (recorded as AUTHORIZATION_DENIED) or password change required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /jobs/sample-input:
    get:
      summary: Authored synthetic sample input and the input format requirements
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Sample parameters, CSV content and marker allowlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleInputResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /jobs:
    post:
      summary: Submit a job (owner = current user); the input file is sent inline as UTF-8 text
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobSubmitRequest'
      responses:
        '201':
          description: Job created in QUEUED with its bookmarkable status URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmitResponse'
        '200':
          description: Replay of an earlier submission with the same Idempotency-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmitResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/CsrfError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '503':
          description: Executor not ready; no job was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      summary: List the current user's jobs, most recently updated first
      security:
        - sessionCookie: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        '200':
          description: Page of the owner's jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /jobs/{jobId}:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string } }
    get:
      summary: Job detail with status history (owner only)
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Job detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetailResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete the job, its input and results (owner only)
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Job and all related data deleted
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/CsrfError'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: portal_session
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
  schemas:
    RequestMeta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
          format: uuid
    UserRole:
      type: string
      enum: [USER, AUDITOR, ADMIN]
    Permission:
      type: string
      enum: [AUDIT_READ, USER_MANAGE]
    AuthenticatedUser:
      type: object
      additionalProperties: false
      required: [id, email, role, permissions, passwordChangeRequired]
      properties:
        id:
          type: string
          maxLength: 128
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/UserRole'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        passwordChangeRequired:
          type: boolean
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          maxLength: 1024
          writeOnly: true
    LoginResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [user, csrfToken]
          properties:
            user:
              $ref: '#/components/schemas/AuthenticatedUser'
            csrfToken:
              type: string
        meta:
          $ref: '#/components/schemas/RequestMeta'
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/AuthenticatedUser'
        meta:
          $ref: '#/components/schemas/RequestMeta'
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 1024
          writeOnly: true
        newPassword:
          type: string
          maxLength: 1024
          writeOnly: true
    AuditEventType:
      type: string
      enum:
        - LOGIN_SUCCESS
        - LOGIN_FAILURE
        - ACCOUNT_LOCKED
        - LOGOUT
        - AUTHORIZATION_DENIED
        - PASSWORD_CHANGED
        - PASSWORD_RESET
        - USER_CREATED
        - USER_DISABLED
        - USER_ENABLED
        - USER_ROLE_CHANGED
        - USER_ANONYMIZED
        - AUDIT_QUERIED
        - AUDIT_RETENTION_CLEANUP
        - JOB_SUBMITTED
        - JOB_STATUS_CHANGED
        - JOB_DELETED
        - JOB_INPUT_REJECTED
        - RESULT_DOWNLOADED
    AuditOutcome:
      type: string
      enum: [SUCCESS, DENIED, FAILURE]
    AuditResourceType:
      type: string
      enum: [USER, SESSION, AUDIT, JOB, RESULT]
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        [id, occurredAt, actorId, eventType, resourceType, resourceId, outcome, requestId, metadata]
      properties:
        id:
          type: string
        occurredAt:
          type: string
          format: date-time
        actorId:
          type: [string, 'null']
        eventType:
          $ref: '#/components/schemas/AuditEventType'
        resourceType:
          $ref: '#/components/schemas/AuditResourceType'
        resourceId:
          type: [string, 'null']
        outcome:
          $ref: '#/components/schemas/AuditOutcome'
        requestId:
          type: string
          maxLength: 128
        metadata:
          type: object
    AuditEventListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, page, limit, total]
          properties:
            items:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/AuditEvent'
            page:
              type: integer
              minimum: 1
            limit:
              type: integer
              minimum: 1
              maximum: 100
            total:
              type: integer
              minimum: 0
        meta:
          $ref: '#/components/schemas/RequestMeta'
    JobStatus:
      type: string
      enum: [QUEUED, RUNNING, COMPLETED, FAILED]
    JobParameters:
      type: object
      additionalProperties: false
      required: [sampleLabel, ageBand, focusArea]
      properties:
        sampleLabel:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9 _.-]+$'
        ageBand:
          type: string
          enum: ['18-29', '30-39', '40-49', '50-59', '60+']
        focusArea:
          type: string
          enum: [GENERAL, CARDIOMETABOLIC, LIVER, KIDNEY]
        lifestyleFactors:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum: [SMOKING, LOW_ACTIVITY, HIGH_ALCOHOL, POOR_SLEEP]
        simulateFailure:
          type: boolean
          default: false
    JobInputFile:
      type: object
      additionalProperties: false
      required: [name, content]
      properties:
        name:
          type: string
          maxLength: 128
          description: Display name only; never used as a storage path
        content:
          type: string
          maxLength: 65536
          description: UTF-8 CSV with header marker,value,unit (1-50 rows, at most 64 KB)
    JobSubmitRequest:
      type: object
      additionalProperties: false
      required: [parameters, file]
      properties:
        parameters:
          $ref: '#/components/schemas/JobParameters'
        file:
          $ref: '#/components/schemas/JobInputFile'
    JobSummary:
      type: object
      additionalProperties: false
      required: [id, sampleLabel, status, createdAt, updatedAt, expiresAt]
      properties:
        id: { type: string }
        sampleLabel: { type: string }
        status: { $ref: '#/components/schemas/JobStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    JobDetail:
      allOf:
        - $ref: '#/components/schemas/JobSummary'
        - type: object
          required: [parameters, file, history, failureSummary, statusUrl]
          properties:
            parameters: { $ref: '#/components/schemas/JobParameters' }
            file:
              type: object
              required: [name, sizeBytes, rowCount]
              properties:
                name: { type: string }
                sizeBytes: { type: integer }
                rowCount: { type: integer }
            history:
              type: array
              items:
                type: object
                required: [status, occurredAt, summary]
                properties:
                  status: { $ref: '#/components/schemas/JobStatus' }
                  occurredAt: { type: string, format: date-time }
                  summary: { type: [string, 'null'] }
            failureSummary: { type: [string, 'null'] }
            statusUrl: { type: string }
    JobSubmitResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [job, statusUrl]
          properties:
            job: { $ref: '#/components/schemas/JobSummary' }
            statusUrl: { type: string, example: /jobs/cmgq1z3b40000abcd1234efgh }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    JobListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items, page, limit, total]
          properties:
            items:
              type: array
              maxItems: 100
              items: { $ref: '#/components/schemas/JobSummary' }
            page: { type: integer, minimum: 1 }
            limit: { type: integer, minimum: 1, maximum: 100 }
            total: { type: integer, minimum: 0 }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    JobDetailResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/JobDetail' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    SampleInputResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [parameters, file, format]
          properties:
            parameters: { $ref: '#/components/schemas/JobParameters' }
            file: { $ref: '#/components/schemas/JobInputFile' }
            format:
              type: object
              required: [header, maxBytes, maxRows, markers]
              properties:
                header: { type: string, enum: ['marker,value,unit'] }
                maxBytes: { type: integer }
                maxRows: { type: integer }
                markers:
                  type: array
                  items:
                    type: object
                    required: [marker, unit, min, max]
                    properties:
                      marker: { type: string }
                      unit: { type: string }
                      min: { type: number }
                      max: { type: number }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    ApiError:
      type: object
      additionalProperties: false
      required: [error, meta]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              type: string
              enum:
                - AUTHENTICATION_FAILED
                - AUTHENTICATION_REQUIRED
                - AUTHORIZATION_DENIED
                - CSRF_INVALID
                - INTERNAL_ERROR
                - NOT_FOUND
                - NOT_IMPLEMENTED
                - PASSWORD_CHANGE_REQUIRED
                - RATE_LIMITED
                - SERVICE_UNAVAILABLE
                - VALIDATION_FAILED
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  field:
                    type: string
                  message:
                    type: string
        meta:
          $ref: '#/components/schemas/RequestMeta'
  responses:
    ValidationError:
      description: Request validation failed without echoing raw input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthenticationError:
      description: Authentication failed without account-existence disclosure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthenticationRequired:
      description: No valid authenticated session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    CsrfError:
      description: Missing or invalid X-CSRF-Token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimitError:
      description: Route rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource is missing, deleted, expired or not accessible (indistinguishable)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
