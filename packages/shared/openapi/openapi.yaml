openapi: 3.1.0
info:
  title: Smart Checkup Portal API
  version: 0.1.0
  description: Local training API. It accepts synthetic or de-identified data only.
servers:
  - url: https://localhost/api/v1
paths:
  /health:
    get:
      summary: Process liveness
      responses:
        '200':
          description: Process is alive
  /health/ready:
    get:
      summary: Service readiness
      responses:
        '200':
          description: SQLite dependency is ready
        '503':
          description: Service is not ready or draining
  /auth/csrf-token:
    get:
      summary: Create or return a server-side synchronizer token
      responses:
        '200':
          description: CSRF token for state-changing requests
  /auth/login:
    post:
      summary: Start a server-side session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session and CSRF token
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /auth/logout:
    post:
      summary: Revoke the current session
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Session revoked
  /auth/me:
    get:
      summary: Return the authenticated user
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current user
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: portal_session
  schemas:
    RequestMeta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
          format: uuid
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          writeOnly: true
    ApiError:
      type: object
      additionalProperties: false
      required: [error, meta]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  field:
                    type: string
                  message:
                    type: string
        meta:
          $ref: '#/components/schemas/RequestMeta'
  responses:
    ValidationError:
      description: Request validation failed without echoing raw input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthenticationError:
      description: Authentication failed without account-existence disclosure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimitError:
      description: Route rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
