openapi: 3.1.0
info:
  title: Smart Checkup Portal API
  version: 0.1.0
  description: Local training API. It accepts synthetic or de-identified data only.
servers:
  - url: https://localhost/api/v1
paths:
  /health:
    get:
      summary: Process liveness
      responses:
        '200':
          description: Process is alive
  /health/ready:
    get:
      summary: Service readiness
      responses:
        '200':
          description: SQLite dependency is ready
        '503':
          description: Service is not ready or draining
  /auth/csrf-token:
    get:
      summary: Create or return a server-side synchronizer token
      responses:
        '200':
          description: CSRF token for state-changing requests
  /auth/login:
    post:
      summary: Start a server-side session
      description: >-
        Regenerates the session ID and returns a new CSRF token. Every failure (unknown account,
        wrong password, locked or disabled account) returns the same 401 response.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session and CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/CsrfError'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /auth/logout:
    post:
      summary: Revoke the current session
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/CsrfError'
  /auth/me:
    get:
      summary: Return the authenticated user
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current user without credential or session internals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /auth/password:
    post:
      summary: Change the current user's password
      description: >-
        Applies the server-side password policy, clears the forced-change flag and revokes the
        user's other sessions.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/CsrfError'
  /audit-events:
    get:
      summary: List audit events (requires AUDIT_READ)
      description: Read-only, newest first. Metadata is redacted and never contains e-mail addresses.
      security:
        - sessionCookie: []
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: eventType, in: query, schema: { $ref: '#/components/schemas/AuditEventType' } }
        - { name: outcome, in: query, schema: { $ref: '#/components/schemas/AuditOutcome' } }
        - { name: actorId, in: query, schema: { type: string, maxLength: 128 } }
        - {
            name: resourceType,
            in: query,
            schema: { $ref: '#/components/schemas/AuditResourceType' },
          }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        '200':
          description: Page of audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          description: Missing AUDIT_READ (recorded as AUTHORIZATION_DENIED) or password change required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: portal_session
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
  schemas:
    RequestMeta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
          format: uuid
    UserRole:
      type: string
      enum: [USER, AUDITOR, ADMIN]
    Permission:
      type: string
      enum: [AUDIT_READ, USER_MANAGE]
    AuthenticatedUser:
      type: object
      additionalProperties: false
      required: [id, email, role, permissions, passwordChangeRequired]
      properties:
        id:
          type: string
          maxLength: 128
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/UserRole'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        passwordChangeRequired:
          type: boolean
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          maxLength: 1024
          writeOnly: true
    LoginResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [user, csrfToken]
          properties:
            user:
              $ref: '#/components/schemas/AuthenticatedUser'
            csrfToken:
              type: string
        meta:
          $ref: '#/components/schemas/RequestMeta'
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/AuthenticatedUser'
        meta:
          $ref: '#/components/schemas/RequestMeta'
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 1024
          writeOnly: true
        newPassword:
          type: string
          maxLength: 1024
          writeOnly: true
    AuditEventType:
      type: string
      enum:
        - LOGIN_SUCCESS
        - LOGIN_FAILURE
        - ACCOUNT_LOCKED
        - LOGOUT
        - AUTHORIZATION_DENIED
        - PASSWORD_CHANGED
        - PASSWORD_RESET
        - USER_CREATED
        - USER_DISABLED
        - USER_ENABLED
        - USER_ROLE_CHANGED
        - USER_ANONYMIZED
        - AUDIT_QUERIED
        - AUDIT_RETENTION_CLEANUP
        - JOB_SUBMITTED
        - JOB_STATUS_CHANGED
        - JOB_DELETED
        - RESULT_DOWNLOADED
    AuditOutcome:
      type: string
      enum: [SUCCESS, DENIED, FAILURE]
    AuditResourceType:
      type: string
      enum: [USER, SESSION, AUDIT, JOB, RESULT]
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        [id, occurredAt, actorId, eventType, resourceType, resourceId, outcome, requestId, metadata]
      properties:
        id:
          type: string
        occurredAt:
          type: string
          format: date-time
        actorId:
          type: [string, 'null']
        eventType:
          $ref: '#/components/schemas/AuditEventType'
        resourceType:
          $ref: '#/components/schemas/AuditResourceType'
        resourceId:
          type: [string, 'null']
        outcome:
          $ref: '#/components/schemas/AuditOutcome'
        requestId:
          type: string
          maxLength: 128
        metadata:
          type: object
    AuditEventListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, page, limit, total]
          properties:
            items:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/AuditEvent'
            page:
              type: integer
              minimum: 1
            limit:
              type: integer
              minimum: 1
              maximum: 100
            total:
              type: integer
              minimum: 0
        meta:
          $ref: '#/components/schemas/RequestMeta'
    ApiError:
      type: object
      additionalProperties: false
      required: [error, meta]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              type: string
              enum:
                - AUTHENTICATION_FAILED
                - AUTHENTICATION_REQUIRED
                - AUTHORIZATION_DENIED
                - CSRF_INVALID
                - INTERNAL_ERROR
                - NOT_FOUND
                - NOT_IMPLEMENTED
                - PASSWORD_CHANGE_REQUIRED
                - RATE_LIMITED
                - VALIDATION_FAILED
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  field:
                    type: string
                  message:
                    type: string
        meta:
          $ref: '#/components/schemas/RequestMeta'
  responses:
    ValidationError:
      description: Request validation failed without echoing raw input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthenticationError:
      description: Authentication failed without account-existence disclosure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthenticationRequired:
      description: No valid authenticated session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    CsrfError:
      description: Missing or invalid X-CSRF-Token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimitError:
      description: Route rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
