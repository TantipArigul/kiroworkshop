services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: ${ENV_FILE:-.env}
    expose:
      - '3000'
    volumes:
      - ${ENCRYPTED_DATA_ROOT:?Set ENCRYPTED_DATA_ROOT}:/var/lib/portal-private
    restart: unless-stopped
  caddy:
    image: caddy:2.11.4
    depends_on:
      - api
    environment:
      # Host-run Nextflow mode: API_UPSTREAM=host.docker.internal:3000 (see docker/README.md).
      - API_UPSTREAM=${API_UPSTREAM:-api:3000}
    ports:
      # Port 80 only redirects to HTTPS (Caddy automatic HTTPS); content is served on 443.
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/web/dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
