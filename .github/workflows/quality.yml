name: quality
on:
  pull_request:
  push:
    branches: [main]

# Read-only token; no job holds a runtime secret or reaches the training server (deployment.md).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
      - run: corepack enable
      - run: corepack prepare pnpm@12.8.1 --activate
      - run: pnpm install --frozen-lockfile
      # Generated, gitignored inputs: `@portal/shared` resolves to its `dist/` build and the API
      # imports the Prisma client from `apps/api/src/generated/`. Both must exist before checks.
      - run: pnpm --filter @portal/shared build
      - run: pnpm --filter @portal/api prisma:generate
        env:
          DATABASE_URL: file:./data/ci.db
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:properties
      - run: pnpm validate:tokens
      - run: pnpm build
      - run: git diff --check

  security:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
      - run: corepack enable
      - run: corepack prepare pnpm@12.8.1 --activate
      - name: Production dependencies (fail on high or critical)
        run: pnpm audit --prod --audit-level=high
      - name: All dependencies (report only)
        run: pnpm audit
        continue-on-error: true
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Secret scan (full history, findings redacted)
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  image:
    needs: [verify, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build API runtime and migration images
        run: |
          docker build -f apps/api/Dockerfile -t "portal-api:${GITHUB_SHA}" .
          docker build -f apps/api/Dockerfile --target migrate -t "portal-migrate:${GITHUB_SHA}" .
      - name: Record image ID
        run: docker image inspect --format '{{.Id}}' "portal-api:${GITHUB_SHA}" | tee image-id.txt
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: portal-api:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: api-image-${{ github.sha }}
          path: |
            image-id.txt
            sbom.spdx.json
          retention-days: 30
