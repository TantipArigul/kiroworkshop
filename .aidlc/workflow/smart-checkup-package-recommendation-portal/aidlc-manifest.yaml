    deployment: "Local Docker Compose/Linux, HTTPS port 443, certificate automation"
    outOfScope: "Real medical/genomic processing, diagnosis, AI training, patient data, email, multi-pipeline, HA, large scale, analytics"
    priority: "Security/foundation, frontend mock, backend and executor, polish, verification"
