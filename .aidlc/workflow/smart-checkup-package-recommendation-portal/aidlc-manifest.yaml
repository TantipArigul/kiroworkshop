        scope: "API unit/integration (+triggers)/PBT; web typecheck + returnTo unit; E2E deferred"
        openItems: "Resolve first in Wave 1 with Add-on; ask before deleting files or adding data files"
        granularity: "Single concern, 0.5-2 days, ownership, acceptance and validation"
        parallelism: "Sequential waves; non-overlapping parallel within wave only"
